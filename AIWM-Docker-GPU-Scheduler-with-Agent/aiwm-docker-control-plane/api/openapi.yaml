components:
  securitySchemes:
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent-token
    publicBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    AgentID:
      in: path
      name: agentID
      required: true
      schema:
        type: string
    ServerID:
      in: path
      name: serverID
      required: true
      schema:
        type: string
    JobID:
      in: path
      name: jobID
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credential for this boundary
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Organization:
      type: "object"
      properties:
        id:
          type: "string"
        code:
          type: "string"
        name:
          type: "string"
        enabled:
          type: "boolean"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "code"
        - "name"
        - "enabled"
        - "createdAt"
        - "updatedAt"
    User:
      type: "object"
      properties:
        id:
          type: "string"
        username:
          type: "string"
        role:
          type: "string"
          enum:
            - "ADMIN"
            - "ORGANIZATION_USER"
        organizationId:
          type: "string"
        enabled:
          type: "boolean"
      required:
        - "id"
        - "username"
        - "role"
        - "organizationId"
        - "enabled"
    Principal:
      type: "object"
      properties:
        user:
          $ref: "#/components/schemas/User"
        organization:
          $ref: "#/components/schemas/Organization"
      required:
        - "user"
        - "organization"
    LoginRequest:
      type: "object"
      properties:
        username:
          type: "string"
          maxLength: 200
        password:
          type: "string"
          format: "password"
          writeOnly: true
          maxLength: 256
      required:
        - "username"
        - "password"
      additionalProperties: false
    LoginResult:
      type: "object"
      properties:
        token:
          type: "string"
          description: "Session opaque, TTL 8 giờ; chỉ lưu hash tại PostgreSQL."
        expiresAt:
          type: "string"
          format: "date-time"
        user:
          $ref: "#/components/schemas/User"
        organization:
          $ref: "#/components/schemas/Organization"
      required:
        - "token"
        - "expiresAt"
        - "user"
        - "organization"
    OrganizationInput:
      type: "object"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 32
        name:
          type: "string"
          minLength: 1
          maxLength: 200
        enabled:
          type: "boolean"
      required:
        - "code"
        - "name"
      additionalProperties: false
    UserInput:
      type: "object"
      properties:
        username:
          type: "string"
          minLength: 1
          maxLength: 200
        password:
          type: "string"
          format: "password"
          writeOnly: true
          maxLength: 256
          description: "Tạo user: 12–256 byte; sửa user: bỏ trống để giữ mật khẩu. Sửa user thu hồi các session."
        role:
          type: "string"
          enum:
            - "ADMIN"
            - "ORGANIZATION_USER"
        organizationId:
          type: "string"
          description: "Organization bất biến khi sửa User."
        enabled:
          type: "boolean"
      required:
        - "username"
        - "role"
        - "organizationId"
      additionalProperties: false
    EnrollmentInput:
      type: "object"
      properties:
        displayName:
          type: "string"
          minLength: 1
          maxLength: 200
        labels:
          type: "object"
          maxProperties: 32
          additionalProperties:
            type: "string"
            maxLength: 256
          propertyNames:
            minLength: 1
            maxLength: 64
        organizationId:
          type: "string"
          description: "Chỉ ADMIN được gửi; nếu bỏ qua dùng organization của account. ORGANIZATION_USER gửi field có giá trị bị 403."
      required:
        - "displayName"
      additionalProperties: false
    Enrollment:
      type: "object"
      properties:
        id:
          type: "string"
        organizationId:
          type: "string"
        serverId:
          type: "string"
        displayName:
          type: "string"
        labels:
          type:
            - "object"
            - "null"
          additionalProperties:
            type: "string"
        expiresAt:
          type: "string"
          format: "date-time"
        machineId:
          type: "string"
        revoked:
          type: "boolean"
      required:
        - "id"
        - "organizationId"
        - "serverId"
        - "displayName"
        - "expiresAt"
        - "revoked"
    EnrollmentResult:
      allOf:
        - {"$ref": "#/components/schemas/Enrollment"}
        - {"type": "object", "properties": {"enrollmentToken": {"type": "string", "description": "Secret chỉ trả khi tạo; lần bind đầu trong 24 giờ; sau bind chỉ cùng machineId được register lại."}}, "required": ["enrollmentToken"]}
    RegisterAgentRequest:
      type: object
      required:
      - protocolVersion
      - machineId
      - name
      properties:
        protocolVersion:
          type: string
          enum:
          - v1
        machineId:
          type: string
        name:
          type: string
        address:
          type: string
        agentVersion:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        capabilities:
          type: array
          items:
            type: string
    InventoryReport:
      type: object
      required:
      - sequence
      - observedAt
      - gpus
      - containers
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        observedAt:
          type: string
          format: date-time
        dockerVersion:
          type: string
        gpus:
          type: array
          items:
            $ref: '#/components/schemas/GPU'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/Container'
        processes:
          type: array
          items:
            $ref: '#/components/schemas/GPUProcess'
        host:
          $ref: '#/components/schemas/HostInfo'
    GPU:
      type: object
      required:
      - uuid
      - index
      - model
      - memoryTotalMiB
      - memoryUsedMiB
      - healthy
      properties:
        uuid:
          type: string
        index:
          type: integer
        model:
          type: string
        memoryTotalMiB:
          type: integer
          format: int64
        memoryUsedMiB:
          type: integer
          format: int64
        utilizationPct:
          type: number
        temperatureC:
          type: number
        healthy:
          type: boolean
        state:
          type: string
          enum:
          - FREE
          - RESERVED
          - ALLOCATED
          - OCCUPIED_LEGACY
          - OCCUPIED_UNKNOWN
          - UNHEALTHY
        assignedJobId:
          type: string
        stateReason:
          type: string
        observedConsumers:
          type: array
          items:
            type: string
    Container:
      type: object
      required:
      - id
      - name
      - image
      - state
      - origin
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        state:
          type: string
        origin:
          type: string
          enum:
          - MANAGED
          - LEGACY
          - UNKNOWN
        jobId:
          type: string
        gpuUuids:
          type: array
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        exitCode:
          type: integer
    GPUProcess:
      type: object
      required:
      - pid
      - gpuUuid
      - usedMemoryMiB
      properties:
        pid:
          type: integer
        gpuUuid:
          type: string
        usedMemoryMiB:
          type: integer
          format: int64
        containerId:
          type: string
        processName:
          type: string
    AgentCommand:
      type: object
      required:
      - id
      - type
      - payload
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - START_CONTAINER
          - STOP_CONTAINER
        payload:
          oneOf:
          - $ref: '#/components/schemas/StartContainerPayload'
          - $ref: '#/components/schemas/StopContainerPayload'
    StartContainerPayload:
      type: object
      required:
      - jobId
      - name
      - image
      - gpuUuids
      properties:
        jobId:
          type: string
        name:
          type: string
        image:
          type: string
        command:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
        gpuUuids:
          type: array
          minItems: 1
          items:
            type: string
        cpuMilli:
          type: integer
          format: int64
          minimum: 0
        memoryMiB:
          type: integer
          format: int64
          minimum: 0
        labels:
          type: object
          additionalProperties:
            type: string
    StopContainerPayload:
      type: object
      required:
      - jobId
      - graceSeconds
      properties:
        jobId:
          type: string
        containerId:
          type: string
        graceSeconds:
          type: integer
          minimum: 0
    CreateJobRequest:
      type: object
      required:
      - name
      - image
      - resources
      - workloadType
      - necessityLevel
      - necessityReason
      - systemImportance
      - neededAt
      - ttlSeconds
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 128
        image:
          type: string
          maxLength: 512
        backend:
          type: string
          enum:
          - DOCKER
          default: DOCKER
        command:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
        resources:
          $ref: '#/components/schemas/AllocationResources'
        workloadType:
          type: string
          enum:
          - TRAINING
          - INFERENCE
        necessityLevel:
          type: string
          enum:
          - NECESSITY_1
          - NECESSITY_2
          - NECESSITY_3
          - NECESSITY_4
        necessityReason:
          type: string
          description: ID từ jobs/options theo workloadType + necessityLevel; CUSTOM cần necessityExplanation.
        necessityExplanation:
          type: string
          maxLength: 4096
        systemImportance:
          type: string
          enum:
          - CRITICAL_SPECIAL
          - VERY_IMPORTANT
          - IMPORTANT
          - NORMAL
        neededAt:
          type: string
          format: date-time
          description: RFC3339 có timezone; start cố định, chuẩn hóa UTC. Chỉ chấp nhận quá khứ trong tolerance 60 giây và interval chưa kết thúc.
        ttlSeconds:
          type: integer
          minimum: 1
          description: Thời lượng cấp GPU tính từ neededAt, đơn vị giây; end loại trừ. Maximum từ jobs/options (mặc định 2592000). Hết hạn gửi STOP, release sau inventory xác nhận.
      additionalProperties: false
      description: Intent-based request; backend đánh giá lại policy và snapshot rồi tạo QUEUED. Scheduler cycle
        re-evaluate trước atomic reservation.
    CommandAck:
      type: object
      required:
      - succeeded
      properties:
        succeeded:
          type: boolean
        message:
          type: string
        containerId:
          type: string
    Strategy:
      type: string
      enum:
      - first-fit
      - best-fit
      - bin-pack
      - fragmentation-aware
    JobStatus:
      type: string
      enum:
      - QUEUED
      - ASSIGNED
      - STARTING
      - RUNNING
      - STOPPING
      - STOPPED
      - CANCELLED
      - SUCCEEDED
      - FAILED
    HostInfo:
      type: object
      properties:
        hostname:
          type: string
        os:
          type: string
        architecture:
          type: string
        cpuCount:
          type: integer
        memoryTotalMiB:
          type: integer
      required: []
    ResourceRequest:
      type: object
      required:
      - gpuCount
      properties:
        gpuCount:
          type: integer
          minimum: 1
        gpuModel:
          type: string
        minVramMiB:
          type: integer
          minimum: 0
        cpuMilli:
          type: integer
          minimum: 0
        memoryMiB:
          type: integer
          minimum: 0
        allowSharedGpu:
          type: boolean
          default: false
          const: false
        performanceProfile:
          type: string
          description: AUTO hoặc HIGH_PERFORMANCE từ jobs/options. Các ID general/a100-equivalent/h100-equivalent chỉ giữ tương thích client cũ.
        fp8Required:
          type: boolean
      additionalProperties: false
    JobEvent:
      type: object
      properties:
        jobId:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        reason:
          type: string
        at:
          type: string
          format: date-time
      required:
      - jobId
      - status
      - reason
      - at
    Assignment:
      type: object
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        serverId:
          type: string
        gpuUuids:
          type: array
          items:
            type: string
        commandId:
          type: string
        assignedAt:
          type: string
          format: date-time
        reservationState:
          type: string
          enum:
          - PLANNED
          - RESERVED
          - ALLOCATED
          - RELEASED
        releasedAt:
          type: string
          format: date-time
        strategy:
          $ref: '#/components/schemas/Strategy'
        score:
          type: number
        reason:
          type: string
      required:
      - startAt
      - endAt
      - serverId
      - gpuUuids
      - commandId
      - assignedAt
      - reservationState
      - strategy
      - score
      - reason
    Job:
      type: object
      properties:
        requestedStartAt:
          type: string
          format: date-time
        requestedEndAt:
          type: string
          format: date-time
        organizationId:
          type: string
          description: "Ownership do backend xác định; GPU suy ra từ Server."
        name:
          type: string
          minLength: 3
          maxLength: 128
        image:
          type: string
          maxLength: 512
        backend:
          type: string
          enum:
          - DOCKER
          default: DOCKER
        command:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
            const: '[redacted]'
          description: Values are never returned by public job APIs.
        resources:
          $ref: '#/components/schemas/ResourceRequest'
        priority:
          type: integer
          minimum: 0
          default: 0
          maximum: 1000
          description: Legacy snapshot field; không dùng để xếp queue mới, không nhận trong CreateJobRequest.
        serverSelector:
          type: object
          additionalProperties:
            type: string
        strategy:
          $ref: '#/components/schemas/Strategy'
          description: Cấu hình lúc submit; assignment.strategy là thuật toán thực sự lúc placement.
        id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        statusReason:
          type: string
        assignment:
          $ref: '#/components/schemas/Assignment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        containerId:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/JobEvent'
        workloadType:
          type: string
          enum:
          - TRAINING
          - INFERENCE
          - ''
          description: ' Job cũ trước intent có thể mang zero value.'
        necessityLevel:
          type: string
          enum:
          - NECESSITY_1
          - NECESSITY_2
          - NECESSITY_3
          - NECESSITY_4
          - ''
          description: ' Job cũ trước intent có thể mang zero value.'
        necessityReason:
          type: string
          description: ID từ jobs/options theo workloadType + necessityLevel; CUSTOM cần necessityExplanation. Job
            cũ trước intent có thể mang zero value.
        necessityExplanation:
          type: string
          maxLength: 4096
        systemImportance:
          type: string
          enum:
          - CRITICAL_SPECIAL
          - VERY_IMPORTANT
          - IMPORTANT
          - NORMAL
          - ''
          description: ' Job cũ trước intent có thể mang zero value.'
        neededAt:
          type: string
          description: RFC3339 có timezone; start cố định, chuẩn hóa UTC. Chỉ chấp nhận quá khứ trong tolerance 60 giây và interval chưa kết thúc.
            Job cũ trước intent có thể mang zero value.
        ttlSeconds:
          type: integer
          minimum: 0
          description: Thời lượng cấp GPU tính từ neededAt, đơn vị giây; end loại trừ. Maximum từ jobs/options (mặc định 2592000). Hết hạn gửi STOP, release sau inventory xác nhận.
            Job cũ trước intent có thể mang zero value.
        necessityLabel:
          type: string
        policy:
          $ref: '#/components/schemas/PolicyDecision'
      required:
      - id
      - name
      - image
      - backend
      - resources
      - priority
      - strategy
      - status
      - createdAt
      - updatedAt
      - events
      - policy
      - necessityLabel
    Server:
      type: object
      properties:
        organizationId:
          type: string
          description: "Ownership do backend xác định; GPU suy ra từ Server."
        id:
          type: string
        machineId:
          type: string
        name:
          type: string
        address:
          type: string
        agentVersion:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
          - DRAINING
        drained:
          type: boolean
        schedulable:
          type: boolean
        schedulingReason:
          type: string
        host:
          $ref: '#/components/schemas/HostInfo'
        lastHeartbeatAt:
          type: string
          format: date-time
        lastInventoryAt:
          type: string
          format: date-time
        inventoryReceivedAt:
          type: string
          format: date-time
        inventoryVersion:
          type: integer
        dockerVersion:
          type: string
        gpus:
          type: array
          items:
            $ref: '#/components/schemas/GPU'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/Container'
      required:
      - id
      - machineId
      - name
      - status
      - drained
      - schedulable
      - schedulingReason
      - host
      - lastHeartbeatAt
      - inventoryVersion
      - gpus
      - containers
    ClusterSummary:
      type: object
      properties:
        serversOffline:
          type: "integer"
        gpusReserved:
          type: "integer"
        gpusAllocated:
          type: "integer"
        gpusUnhealthy:
          type: "integer"
        serversTotal:
          type: integer
        serversOnline:
          type: integer
        gpusTotal:
          type: integer
        gpusFree:
          type: integer
        gpusOccupied:
          type: integer
        gpusOccupiedLegacy:
          type: integer
        gpusOccupiedUnknown:
          type: integer
        jobsQueued:
          type: integer
        jobsRunning:
          type: integer
        recentEvents:
          type: array
          items:
            $ref: '#/components/schemas/JobEvent'
      required: []
    GPUInventoryItem:
      type: object
      properties:
        organizationId:
          type: string
          description: "Ownership do backend xác định; GPU suy ra từ Server."
        serverId:
          type: string
        serverName:
          type: string
        serverStatus:
          type: string
          enum:
          - ONLINE
          - OFFLINE
          - DRAINING
        gpu:
          $ref: '#/components/schemas/GPU'
      required: []
    ContainerInventoryItem:
      type: object
      properties:
        serverId:
          type: string
        serverName:
          type: string
        container:
          $ref: '#/components/schemas/Container'
      required: []
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
              description: Thông báo validation theo JSON field path; lỗi JSON tổng quát dùng body.
          required:
          - code
          - message
      required:
      - error
    RegisterAgentResponse:
      type: object
      properties:
        agentId:
          type: string
        agentToken:
          type: string
        heartbeatIntervalSeconds:
          type: integer
      required:
      - agentId
      - agentToken
      - heartbeatIntervalSeconds
    AllocationResources:
      type: object
      required:
      - gpuCount
      - minVramMiB
      - performanceProfile
      - fp8Required
      properties:
        gpuCount:
          type: integer
          minimum: 1
          description: Maximum lấy từ jobs/options (mặc định 64).
        minVramMiB:
          type: integer
          minimum: 1
          description: VRAM khả dụng tối thiểu trên từng GPU, MiB.
        cpuMilli:
          type: integer
          minimum: 0
        memoryMiB:
          type: integer
          minimum: 0
        allowSharedGpu:
          type: boolean
          default: false
          const: false
        performanceProfile:
          type: string
          description: AUTO hoặc HIGH_PERFORMANCE từ jobs/options. Các ID general/a100-equivalent/h100-equivalent chỉ giữ tương thích client cũ.
        fp8Required:
          type: boolean
      additionalProperties: false
    PolicyDecision:
      type: object
      properties:
        status:
          type: string
          enum:
          - AUTO_ELIGIBLE
          - COMPETITIVE
          - ''
        reason:
          type: string
        inSizingPlan:
          type: boolean
        withinQuota:
          type: boolean
        quotaUsage:
          type: integer
        source:
          type: string
        evaluatedAt:
          type: string
          format: date-time
      required:
      - status
      - reason
      - inSizingPlan
      - withinQuota
      - quotaUsage
      - source
      - evaluatedAt
      additionalProperties: false
      description: Snapshot lúc submit/commit; GET queue evaluate lại. Auxiliary score không serialize.
    ResourceMatch:
      type: object
      properties:
        satisfiable:
          type: boolean
        recommendedGpuModels:
          type: array
          items:
            type: string
        matchedGpuCount:
          type: integer
          minimum: 0
          description: Số GPU phù hợp tối đa trên một server fresh, không cộng nhiều host.
        recommendationText:
          type: string
        unsatisfiedReason:
          type: string
      required:
      - satisfiable
      - recommendedGpuModels
      - matchedGpuCount
      - recommendationText
      additionalProperties: false
    JobPreview:
      type: object
      properties:
        planningStatus:
          type: string
          enum: [AVAILABLE, CONFLICT]
        requestedStartAt:
          type: string
          format: date-time
        requestedEndAt:
          type: string
          format: date-time
        workloadType:
          type: string
          enum:
          - TRAINING
          - INFERENCE
        policyStatus:
          type: string
          enum:
          - AUTO_ELIGIBLE
          - COMPETITIVE
        policyReason:
          type: string
        necessityLabel:
          type: string
        sizingPlanStatus:
          type: string
        quotaStatus:
          type: string
        policySource:
          type: string
        resourceMatch:
          $ref: '#/components/schemas/ResourceMatch'
        evaluatedAt:
          type: string
          format: date-time
      required:
      - workloadType
      - policyStatus
      - policyReason
      - necessityLabel
      - sizingPlanStatus
      - quotaStatus
      - policySource
      - resourceMatch
      - evaluatedAt
      additionalProperties: false
    AllocationOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
      - id
      - label
      additionalProperties: false
    AllocationOptions:
      type: object
      properties:
        limits:
          type: object
          properties:
            maxGpuCount:
              type: integer
              minimum: 1
            maxTtlSeconds:
              type: integer
              minimum: 1
          required:
          - maxGpuCount
          - maxTtlSeconds
        performanceProfiles:
          type: array
          items:
            $ref: '#/components/schemas/AllocationOption'
        necessityProfiles:
          type: array
          items:
            type: object
            properties:
              workloadType:
                type: string
                enum:
                - TRAINING
                - INFERENCE
              level:
                type: string
                enum:
                - NECESSITY_1
                - NECESSITY_2
                - NECESSITY_3
                - NECESSITY_4
              label:
                type: string
              reasons:
                type: array
                items:
                  $ref: '#/components/schemas/AllocationOption'
            required:
            - workloadType
            - level
            - label
            - reasons
        systemImportance:
          type: array
          items:
            $ref: '#/components/schemas/AllocationOption'
        workloadTypes:
          type: array
          items:
            $ref: '#/components/schemas/AllocationOption'
        customReason:
          $ref: '#/components/schemas/AllocationOption'
      required:
      - limits
      - performanceProfiles
      - necessityProfiles
      - systemImportance
      - workloadTypes
      - customReason
      additionalProperties: false
security:
- publicBearer: []
