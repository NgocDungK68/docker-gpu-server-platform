openapi: 3.1.0
info:
  title: AIWM Docker GPU Control Plane API
  version: 0.4.0
  description: 'Brownfield-safe control plane for standalone Docker GPU servers. Agent APIs

    are machine-to-machine; resource and job APIs are consumed by the web app.

    '
servers:
- url: http://localhost:8080
tags:
- name: System
- name: Agents
- name: Inventory
- name: Jobs
- name: Scheduler
paths:
  /healthz:
    get:
      tags:
      - System
      operationId: health
      responses:
        '200':
          description: Process is alive
      security: []
  /readyz:
    get:
      tags:
      - System
      operationId: ready
      responses:
        '200':
          description: Process can serve traffic
      security: []
  /api/v1/system/summary:
    get:
      tags:
      - System
      operationId: getClusterSummary
      responses:
        '200':
          description: Logical resource pool summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClusterSummary'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/agents/register:
    post:
      tags:
      - Agents
      operationId: registerAgent
      parameters:
      - in: header
        name: X-Enrollment-Token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '201':
          description: Agent registered; the returned token is used as Bearer authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegisterAgentResponse'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/agents/{agentID}/heartbeat:
    post:
      tags:
      - Agents
      operationId: heartbeat
      security:
      - agentBearer: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                observedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Heartbeat accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/agents/{agentID}/inventory:
    put:
      tags:
      - Agents
      operationId: replaceInventory
      security:
      - agentBearer: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryReport'
      responses:
        '200':
          description: Full observed-state snapshot accepted
        '409':
          description: Inventory sequence is stale
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/agents/{agentID}/commands:
    get:
      tags:
      - Agents
      operationId: leaseCommands
      security:
      - agentBearer: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
          maximum: 100
      responses:
        '200':
          description: Commands leased to this agent; execution is idempotent by command id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentCommand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/agents/{agentID}/commands/{commandID}/ack:
    post:
      tags:
      - Agents
      operationId: acknowledgeCommand
      security:
      - agentBearer: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      - in: path
        name: commandID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandAck'
      responses:
        '200':
          description: Command result recorded
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/servers:
    get:
      tags:
      - Inventory
      operationId: listServers
      responses:
        '200':
          description: Registered Docker GPU servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Server'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/servers/{serverID}:
    get:
      tags:
      - Inventory
      operationId: getServer
      parameters:
      - $ref: '#/components/parameters/ServerID'
      responses:
        '200':
          description: Server with GPU and container inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
                required:
                - data
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/servers/{serverID}/drain:
    post:
      tags:
      - Inventory
      operationId: setServerDrained
      parameters:
      - $ref: '#/components/parameters/ServerID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - drained
              properties:
                drained:
                  type: boolean
      responses:
        '200':
          description: Scheduling state changed; running containers are untouched
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/gpus:
    get:
      tags:
      - Inventory
      operationId: listGPUs
      responses:
        '200':
          description: GPUs across all Docker servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GPUInventoryItem'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/containers:
    get:
      tags:
      - Inventory
      operationId: listContainers
      parameters:
      - in: query
        name: origin
        schema:
          type: string
          enum:
          - MANAGED
          - LEGACY
          - UNKNOWN
      responses:
        '200':
          description: Observed containers; LEGACY containers are read-only to AIWM
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContainerInventoryItem'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/jobs:
    get:
      tags:
      - Jobs
      operationId: listJobs
      responses:
        '200':
          description: Submitted managed jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Jobs
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                required:
                - data
        '400':
          description: Structured field validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/jobs/{jobID}:
    get:
      tags:
      - Jobs
      operationId: getJob
      parameters:
      - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Job state and assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                required:
                - data
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/jobs/{jobID}/stop:
    post:
      tags:
      - Jobs
      operationId: stopManagedJob
      parameters:
      - $ref: '#/components/parameters/JobID'
      responses:
        '202':
          description: Cancel queued/unleased job or queue managed stop. Repeated requests are idempotent; release
            waits for actual inventory if a command was delivered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                required:
                - data
        '409':
          description: Job is not stoppable
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/queue:
    get:
      tags:
      - Jobs
      operationId: getQueue
      responses:
        '200':
          description: Jobs sorted by priority descending then submission time
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Policy lane → Necessity → auxiliary priority → CreatedAt → ID; facts/aging được evaluate lại.
  /api/v1/scheduler/run-once:
    post:
      tags:
      - Scheduler
      operationId: runSchedulerOnce
      responses:
        '200':
          description: One scheduling cycle completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assignedJobs:
                        type: integer
                    required:
                    - assignedJobs
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/jobs/options:
    get:
      tags:
      - Jobs
      operationId: jobOptions
      description: Catalog do backend quản lý.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AllocationOptions'
                required:
                - data
        '400':
          description: Structured field validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/jobs/preview:
    post:
      tags:
      - Jobs
      operationId: previewJob
      description: Validate và đối chiếu policy/resources; không tạo Job, command hay reservation.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobPreview'
                required:
                - data
        '400':
          description: Structured field validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
components:
  securitySchemes:
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent-token
    publicBearer:
      type: http
      scheme: bearer
      bearerFormat: operator-api-token
  parameters:
    AgentID:
      in: path
      name: agentID
      required: true
      schema:
        type: string
    ServerID:
      in: path
      name: serverID
      required: true
      schema:
        type: string
    JobID:
      in: path
      name: jobID
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credential for this boundary
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RegisterAgentRequest:
      type: object
      required:
      - protocolVersion
      - machineId
      - name
      properties:
        protocolVersion:
          type: string
          enum:
          - v1
        machineId:
          type: string
        name:
          type: string
        address:
          type: string
        agentVersion:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        capabilities:
          type: array
          items:
            type: string
    InventoryReport:
      type: object
      required:
      - sequence
      - observedAt
      - gpus
      - containers
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        observedAt:
          type: string
          format: date-time
        dockerVersion:
          type: string
        gpus:
          type: array
          items:
            $ref: '#/components/schemas/GPU'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/Container'
        processes:
          type: array
          items:
            $ref: '#/components/schemas/GPUProcess'
        host:
          $ref: '#/components/schemas/HostInfo'
    GPU:
      type: object
      required:
      - uuid
      - index
      - model
      - memoryTotalMiB
      - memoryUsedMiB
      - healthy
      properties:
        uuid:
          type: string
        index:
          type: integer
        model:
          type: string
        memoryTotalMiB:
          type: integer
          format: int64
        memoryUsedMiB:
          type: integer
          format: int64
        utilizationPct:
          type: number
        temperatureC:
          type: number
        healthy:
          type: boolean
        state:
          type: string
          enum:
          - FREE
          - RESERVED
          - ALLOCATED
          - OCCUPIED_LEGACY
          - OCCUPIED_UNKNOWN
          - UNHEALTHY
        assignedJobId:
          type: string
        stateReason:
          type: string
        observedConsumers:
          type: array
          items:
            type: string
    Container:
      type: object
      required:
      - id
      - name
      - image
      - state
      - origin
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        state:
          type: string
        origin:
          type: string
          enum:
          - MANAGED
          - LEGACY
          - UNKNOWN
        jobId:
          type: string
        gpuUuids:
          type: array
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        exitCode:
          type: integer
    GPUProcess:
      type: object
      required:
      - pid
      - gpuUuid
      - usedMemoryMiB
      properties:
        pid:
          type: integer
        gpuUuid:
          type: string
        usedMemoryMiB:
          type: integer
          format: int64
        containerId:
          type: string
        processName:
          type: string
    AgentCommand:
      type: object
      required:
      - id
      - type
      - payload
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - START_CONTAINER
          - STOP_CONTAINER
        payload:
          oneOf:
          - $ref: '#/components/schemas/StartContainerPayload'
          - $ref: '#/components/schemas/StopContainerPayload'
    StartContainerPayload:
      type: object
      required:
      - jobId
      - name
      - image
      - gpuUuids
      properties:
        jobId:
          type: string
        name:
          type: string
        image:
          type: string
        command:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
        gpuUuids:
          type: array
          minItems: 1
          items:
            type: string
        cpuMilli:
          type: integer
          format: int64
          minimum: 0
        memoryMiB:
          type: integer
          format: int64
          minimum: 0
        labels:
          type: object
          additionalProperties:
            type: string
    StopContainerPayload:
      type: object
      required:
      - jobId
      - graceSeconds
      properties:
        jobId:
          type: string
        containerId:
          type: string
        graceSeconds:
          type: integer
          minimum: 0
    CreateJobRequest:
      type: object
      required:
      - name
      - image
      - resources
      - workloadType
      - necessityLevel
      - necessityReason
      - systemImportance
      - neededAt
      - ttlSeconds
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 128
        image:
          type: string
          maxLength: 512
        backend:
          type: string
          enum:
          - DOCKER
          default: DOCKER
        command:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
        resources:
          $ref: '#/components/schemas/AllocationResources'
        workloadType:
          type: string
          enum:
          - TRAINING
          - INFERENCE
        necessityLevel:
          type: string
          enum:
          - NECESSITY_1
          - NECESSITY_2
          - NECESSITY_3
          - NECESSITY_4
        necessityReason:
          type: string
          description: ID từ jobs/options theo workloadType + necessityLevel; CUSTOM cần necessityExplanation.
        necessityExplanation:
          type: string
          maxLength: 4096
        systemImportance:
          type: string
          enum:
          - CRITICAL_SPECIAL
          - VERY_IMPORTANT
          - IMPORTANT
          - NORMAL
        neededAt:
          type: string
          format: date-time
          description: RFC3339 có timezone, normalize UTC; cho phép quá khứ. Nhu cầu mong muốn, chưa là lịch start.
        ttlSeconds:
          type: integer
          minimum: 1
          description: Thời lượng đăng ký, đơn vị giây. Maximum từ jobs/options (mặc định 2592000); chưa tự stop/reclaim.
      additionalProperties: false
      description: Intent-based request; backend đánh giá lại policy và snapshot rồi tạo QUEUED. Scheduler cycle
        re-evaluate trước atomic reservation.
    CommandAck:
      type: object
      required:
      - succeeded
      properties:
        succeeded:
          type: boolean
        message:
          type: string
        containerId:
          type: string
    Strategy:
      type: string
      enum:
      - first-fit
      - best-fit
      - bin-pack
      - fragmentation-aware
    JobStatus:
      type: string
      enum:
      - QUEUED
      - ASSIGNED
      - STARTING
      - RUNNING
      - STOPPING
      - STOPPED
      - CANCELLED
      - SUCCEEDED
      - FAILED
    HostInfo:
      type: object
      properties:
        hostname:
          type: string
        os:
          type: string
        architecture:
          type: string
        cpuCount:
          type: integer
        memoryTotalMiB:
          type: integer
      required: []
    ResourceRequest:
      type: object
      required:
      - gpuCount
      properties:
        gpuCount:
          type: integer
          minimum: 1
        gpuModel:
          type: string
        minVramMiB:
          type: integer
          minimum: 0
        cpuMilli:
          type: integer
          minimum: 0
        memoryMiB:
          type: integer
          minimum: 0
        allowSharedGpu:
          type: boolean
          default: false
          const: false
        performanceProfile:
          type: string
          description: ID từ backend capability catalog tại jobs/options.
        fp8Required:
          type: boolean
      additionalProperties: false
    JobEvent:
      type: object
      properties:
        jobId:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        reason:
          type: string
        at:
          type: string
          format: date-time
      required:
      - jobId
      - status
      - reason
      - at
    Assignment:
      type: object
      properties:
        serverId:
          type: string
        gpuUuids:
          type: array
          items:
            type: string
        commandId:
          type: string
        assignedAt:
          type: string
          format: date-time
        reservationState:
          type: string
          enum:
          - RESERVED
          - ALLOCATED
          - RELEASED
        releasedAt:
          type: string
          format: date-time
        strategy:
          $ref: '#/components/schemas/Strategy'
        score:
          type: number
        reason:
          type: string
      required:
      - serverId
      - gpuUuids
      - commandId
      - assignedAt
      - reservationState
      - strategy
      - score
      - reason
    Job:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 128
        image:
          type: string
          maxLength: 512
        backend:
          type: string
          enum:
          - DOCKER
          default: DOCKER
        command:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
            const: '[redacted]'
          description: Values are never returned by public job APIs.
        resources:
          $ref: '#/components/schemas/ResourceRequest'
        priority:
          type: integer
          minimum: 0
          default: 0
          maximum: 1000
          description: Legacy snapshot field; không dùng để xếp queue mới, không nhận trong CreateJobRequest.
        serverSelector:
          type: object
          additionalProperties:
            type: string
        strategy:
          $ref: '#/components/schemas/Strategy'
          description: Cấu hình lúc submit; assignment.strategy là thuật toán thực sự lúc placement.
        id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        statusReason:
          type: string
        assignment:
          $ref: '#/components/schemas/Assignment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        containerId:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/JobEvent'
        workloadType:
          type: string
          enum:
          - TRAINING
          - INFERENCE
          - ''
          description: ' Job cũ trước intent có thể mang zero value.'
        necessityLevel:
          type: string
          enum:
          - NECESSITY_1
          - NECESSITY_2
          - NECESSITY_3
          - NECESSITY_4
          - ''
          description: ' Job cũ trước intent có thể mang zero value.'
        necessityReason:
          type: string
          description: ID từ jobs/options theo workloadType + necessityLevel; CUSTOM cần necessityExplanation. Job
            cũ trước intent có thể mang zero value.
        necessityExplanation:
          type: string
          maxLength: 4096
        systemImportance:
          type: string
          enum:
          - CRITICAL_SPECIAL
          - VERY_IMPORTANT
          - IMPORTANT
          - NORMAL
          - ''
          description: ' Job cũ trước intent có thể mang zero value.'
        neededAt:
          type: string
          description: RFC3339 có timezone, normalize UTC; cho phép quá khứ. Nhu cầu mong muốn, chưa là lịch start.
            Job cũ trước intent có thể mang zero value.
        ttlSeconds:
          type: integer
          minimum: 0
          description: Thời lượng đăng ký, đơn vị giây. Maximum từ jobs/options (mặc định 2592000); chưa tự stop/reclaim.
            Job cũ trước intent có thể mang zero value.
        necessityLabel:
          type: string
        policy:
          $ref: '#/components/schemas/PolicyDecision'
      required:
      - id
      - name
      - image
      - backend
      - resources
      - priority
      - strategy
      - status
      - createdAt
      - updatedAt
      - events
      - policy
      - necessityLabel
