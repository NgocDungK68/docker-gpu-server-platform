openapi: 3.1.0
info:
  title: AIWM Docker GPU Control Plane API
  version: 0.5.0
  description: "Control Plane cho Docker GPU server độc lập. Public API dùng session nội bộ; Agent dùng enrollment và Agent token. Ownership được backend xác thực."
servers:
- url: http://localhost:8080
tags:
- name: Identity
- name: System
- name: Agents
- name: Inventory
- name: Jobs
- name: Scheduler
paths:
  /healthz:
    get:
      tags:
      - System
      operationId: health
      responses:
        '200':
          description: Process is alive
      security: []
  /readyz:
    get:
      tags:
      - System
      operationId: ready
      responses:
        '200':
          description: Process có thể nhận HTTP; handler không probe PostgreSQL/Agent/GPU
      security: []
  /api/v1/system/summary:
    get:
      parameters:
      - in: query
        name: organizationId
        description: "Chỉ ADMIN được lọc organization; non-admin gửi giá trị bị 403. Không quyết định organization của Job submit."
        schema:
          type: string
      tags:
      - System
      operationId: getClusterSummary
      responses:
        '200':
          description: Logical resource pool summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClusterSummary'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/agents/register:
    post:
      tags:
      - Agents
      operationId: registerAgent
      description: Enrollment resolve Server/Organization server-side; name/labels authoritative từ enrollment. Re-register cùng machine xoay Agent token và đợi FULL inventory.
      parameters:
      - in: header
        name: X-Enrollment-Token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '201':
          description: Agent registered; the returned token is used as Bearer authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegisterAgentResponse'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/agents/{agentID}/heartbeat:
    post:
      tags:
      - Agents
      operationId: heartbeat
      security:
      - agentBearer: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                observedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Heartbeat accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/agents/{agentID}/inventory:
    put:
      tags:
      - Agents
      operationId: replaceInventory
      security:
      - agentBearer: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryReport'
      responses:
        '200':
          description: Full observed-state snapshot accepted
        '409':
          description: Inventory sequence is stale
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/agents/{agentID}/commands:
    get:
      tags:
      - Agents
      operationId: leaseCommands
      security:
      - agentBearer: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
          maximum: 100
      responses:
        '200':
          description: Commands leased to this agent; execution is idempotent by command id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentCommand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/agents/{agentID}/commands/{commandID}/ack:
    post:
      tags:
      - Agents
      operationId: acknowledgeCommand
      security:
      - agentBearer: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      - in: path
        name: commandID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandAck'
      responses:
        '200':
          description: Command result recorded
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/servers:
    get:
      parameters:
      - in: query
        name: organizationId
        description: "Chỉ ADMIN được lọc organization; non-admin gửi giá trị bị 403. Không quyết định organization của Job submit."
        schema:
          type: string
      tags:
      - Inventory
      operationId: listServers
      responses:
        '200':
          description: Registered Docker GPU servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Server'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/servers/{serverID}:
    get:
      tags:
      - Inventory
      operationId: getServer
      parameters:
      - $ref: '#/components/parameters/ServerID'
      responses:
        '200':
          description: Server with GPU and container inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
                required:
                - data
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/servers/{serverID}/drain:
    post:
      tags:
      - Inventory
      operationId: setServerDrained
      parameters:
      - $ref: '#/components/parameters/ServerID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - drained
              properties:
                drained:
                  type: boolean
      responses:
        '200':
          description: Scheduling state changed; running containers are untouched
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/gpus:
    get:
      parameters:
      - in: query
        name: organizationId
        description: "Chỉ ADMIN được lọc organization; non-admin gửi giá trị bị 403. Không quyết định organization của Job submit."
        schema:
          type: string
      tags:
      - Inventory
      operationId: listGPUs
      responses:
        '200':
          description: GPUs across all Docker servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GPUInventoryItem'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/containers:
    get:
      parameters:
      - in: query
        name: organizationId
        description: "Chỉ ADMIN được lọc organization; non-admin gửi giá trị bị 403. Không quyết định organization của Job submit."
        schema:
          type: string
      tags:
      - Inventory
      operationId: listContainers
      parameters:
      - in: query
        name: origin
        schema:
          type: string
          enum:
          - MANAGED
          - LEGACY
          - UNKNOWN
      responses:
        '200':
          description: Observed containers; LEGACY containers are read-only to AIWM
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContainerInventoryItem'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/jobs:
    get:
      parameters:
      - in: query
        name: organizationId
        description: "Chỉ ADMIN được lọc organization; non-admin gửi giá trị bị 403. Không quyết định organization của Job submit."
        schema:
          type: string
      tags:
      - Jobs
      operationId: listJobs
      responses:
        '200':
          description: Submitted managed jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Jobs
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                required:
                - data
        '400':
          description: Structured field validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/jobs/{jobID}:
    get:
      tags:
      - Jobs
      operationId: getJob
      parameters:
      - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Job state and assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                required:
                - data
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/jobs/{jobID}/stop:
    post:
      tags:
      - Jobs
      operationId: stopManagedJob
      parameters:
      - $ref: '#/components/parameters/JobID'
      responses:
        '202':
          description: Cancel queued/unleased job or queue managed stop. Repeated requests are idempotent; release
            waits for actual inventory if a command was delivered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                required:
                - data
        '409':
          description: Job is not stoppable
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/queue:
    get:
      parameters:
      - in: query
        name: organizationId
        description: "Chỉ ADMIN được lọc organization; non-admin gửi giá trị bị 403. Không quyết định organization của Job submit."
        schema:
          type: string
      tags:
      - Jobs
      operationId: getQueue
      responses:
        '200':
          description: Jobs sorted by priority descending then submission time
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Policy lane → Necessity → auxiliary priority → CreatedAt → ID; facts/aging được evaluate lại.
  /api/v1/scheduler/run-once:
    post:
      tags:
      - Scheduler
      operationId: runSchedulerOnce
      description: Chỉ ADMIN; organization ownership là hard constraint trước resource filter và strategy.
      responses:
        '200':
          description: One scheduling cycle completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assignedJobs:
                        type: integer
                    required:
                    - assignedJobs
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          description: Structured error (400 invalid input, 404 absent, 409 conflict, 413 body limit, 500 internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/jobs/options:
    get:
      tags:
      - Jobs
      operationId: jobOptions
      description: Catalog do backend quản lý.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AllocationOptions'
                required:
                - data
        '400':
          description: Structured field validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/jobs/preview:
    post:
      tags:
      - Jobs
      operationId: previewJob
      description: Validate và đối chiếu policy/resources; không tạo Job, command hay reservation.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobPreview'
                required:
                - data
        '400':
          description: Structured field validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
  /api/v1/auth/login:
    post:
      tags:
        - "Identity"
      operationId: "login"
      description: "Đăng nhập nội bộ; không public registration. Rate limit 20 lần/phút/peer IP và 4 hash đồng thời."
      responses:
        "200":
          description: "Thành công"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  data:
                    $ref: "#/components/schemas/LoginResult"
                required:
                  - "data"
        "400":
          description: "DTO không hợp lệ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Không đủ quyền"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Không tìm thấy hoặc ngoài phạm vi organization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Xung đột metadata/ownership"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "default":
          description: "Lỗi có cấu trúc"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Vượt giới hạn login"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      security: []
  /api/v1/auth/me:
    get:
      tags:
        - "Identity"
      operationId: "currentUser"
      description: "Account và organization từ session hiện tại."
      responses:
        "200":
          description: "Thành công"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  data:
                    $ref: "#/components/schemas/Principal"
                required:
                  - "data"
        "400":
          description: "DTO không hợp lệ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Không đủ quyền"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Không tìm thấy hoặc ngoài phạm vi organization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Xung đột metadata/ownership"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "default":
          description: "Lỗi có cấu trúc"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      tags:
        - "Identity"
      operationId: "logout"
      description: "Thu hồi session hiện tại."
      responses:
        "200":
          description: "Thành công"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      loggedOut:
                        type: "boolean"
                    required:
                      - "loggedOut"
                required:
                  - "data"
        "400":
          description: "DTO không hợp lệ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Không đủ quyền"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Không tìm thấy hoặc ngoài phạm vi organization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Xung đột metadata/ownership"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "default":
          description: "Lỗi có cấu trúc"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/organizations:
    get:
      parameters:
      - in: query
        name: organizationId
        description: "Chỉ ADMIN được lọc organization; non-admin gửi giá trị bị 403. Không quyết định organization của Job submit."
        schema:
          type: string
      tags:
        - "Identity"
      operationId: "listOrganizations"
      description: "ADMIN xem nhiều organization; ORGANIZATION_USER chỉ thấy đơn vị của mình."
      responses:
        "200":
          description: "Thành công"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Organization"
                required:
                  - "data"
        "400":
          description: "DTO không hợp lệ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Không đủ quyền"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Không tìm thấy hoặc ngoài phạm vi organization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Xung đột metadata/ownership"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "default":
          description: "Lỗi có cấu trúc"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - "Identity"
      operationId: "createOrganization"
      description: "Chỉ ADMIN; code unique; tạo trả 200."
      responses:
        "200":
          description: "Thành công"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
                required:
                  - "data"
        "400":
          description: "DTO không hợp lệ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Không đủ quyền"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Không tìm thấy hoặc ngoài phạm vi organization"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Xung đột metadata/ownership"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "default":
          description: "Lỗi có cấu trúc"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
  /api/v1/organizations/{organizationID}:
    post:
      tags:
        - "Identity"
      operationId: "updateOrganization"
      description: "Chỉ ADMIN; không chuyển ownership runtime."
      responses:
        "200":
          description: "Thành công"
          content:
