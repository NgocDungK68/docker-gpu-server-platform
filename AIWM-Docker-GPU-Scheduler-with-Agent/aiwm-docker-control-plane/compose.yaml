# Control Plane dùng PostgreSQL bên ngoài; demo đủ stack dùng compose.yaml ở workspace root.
services:
  control-plane:
    build: .
    environment:
      AIWM_HTTP_ADDR: ":8080"
      AIWM_STATE_FILE: /data/control-plane.gob
      AIWM_DATABASE_URL: ${AIWM_DATABASE_URL:?Configure database accessible from this container}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - control-plane-data:/data
volumes:
  control-plane-data:
