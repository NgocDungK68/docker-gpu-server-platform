name: aiwm-demo
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: aiwm
      POSTGRES_USER: aiwm
      POSTGRES_PASSWORD: ${AIWM_POSTGRES_PASSWORD:?Configure AIWM_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${AIWM_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwm -d aiwm"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - metadata-data:/var/lib/postgresql/data
  control-plane:
    build: ./AIWM-Docker-GPU-Scheduler-with-Agent/aiwm-docker-control-plane
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIWM_HTTP_ADDR: ":8080"
      AIWM_STATE_FILE: /data/control-plane.gob
      AIWM_DATABASE_URL: ${AIWM_COMPOSE_DATABASE_URL:?Configure AIWM_COMPOSE_DATABASE_URL}
      AIWM_BOOTSTRAP_ORGANIZATION_CODE: ${AIWM_BOOTSTRAP_ORGANIZATION_CODE:-}
      AIWM_BOOTSTRAP_ORGANIZATION_NAME: ${AIWM_BOOTSTRAP_ORGANIZATION_NAME:-}
      AIWM_BOOTSTRAP_USERNAME: ${AIWM_BOOTSTRAP_USERNAME:-}
      AIWM_BOOTSTRAP_PASSWORD: ${AIWM_BOOTSTRAP_PASSWORD:-}
      AIWM_AGENT_OFFLINE_AFTER: 20s
      AIWM_SCHEDULER_STRATEGY: ${AIWM_SCHEDULER_STRATEGY:-best-fit}
      AIWM_DEV_IN_SIZING_PLAN: ${AIWM_DEV_IN_SIZING_PLAN:-false}
      AIWM_DEV_QUOTA_GPUS: ${AIWM_DEV_QUOTA_GPUS:-4}
      AIWM_DEV_QUOTA_USED_GPUS: ${AIWM_DEV_QUOTA_USED_GPUS:-0}
      AIWM_MAX_GPU_COUNT: ${AIWM_MAX_GPU_COUNT:-64}
      AIWM_MAX_TTL_SECONDS: ${AIWM_MAX_TTL_SECONDS:-2592000}
      AIWM_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "${AIWM_CP_BIND_HOST:-127.0.0.1}:8080:8080"
    volumes:
      - control-plane-data:/data
  agent-a100:
    profiles: [simulation]
    image: aiwm-agent-sim:local
    build:
      context: ./AIWM-Docker-GPU-Scheduler-with-Agent/aiwm-docker-control-plane
      dockerfile: Dockerfile.sim
    depends_on: [control-plane]
    environment: &agent-env
      AIWM_CONTROL_PLANE_URL: http://control-plane:8080
      AIWM_ENROLLMENT_TOKEN: ${AIWM_A100_ENROLLMENT_TOKEN:-}
      AIWM_AGENT_MACHINE_ID: sim-a100
      AIWM_AGENT_NAME: fake-server-a100
      AIWM_AGENT_LABELS: site=hanoi,pool=simulation
      AIWM_AGENT_STATE_FILE: /state/agent.json
      AIWM_AGENT_INVENTORY_INTERVAL: 2s
      AIWM_AGENT_HEARTBEAT_INTERVAL: 2s
      AIWM_AGENT_COMMAND_POLL_INTERVAL: 1s
      AIWM_SIM_EXTERNAL_GPU_INDEXES: "0"
      MOCK_NVML_CONFIG: /profiles/a100-external.yaml
    volumes:
      - ./AIWM-Docker-GPU-Scheduler-with-Agent/aiwm-docker-control-plane/deploy/simulation/profiles:/profiles:ro
      - agent-a100-data:/state
  agent-t4:
    profiles: [simulation]
    image: aiwm-agent-sim:local
    depends_on: [control-plane, agent-a100]
    environment:
      <<: *agent-env
      AIWM_ENROLLMENT_TOKEN: ${AIWM_T4_ENROLLMENT_TOKEN:-}
      AIWM_AGENT_MACHINE_ID: sim-t4
      AIWM_AGENT_NAME: fake-server-t4
      AIWM_AGENT_LABELS: site=hcm,pool=simulation
      AIWM_SIM_EXTERNAL_GPU_INDEXES: ""
      MOCK_NVML_CONFIG: /profiles/t4-empty.yaml
    volumes:
      - ./AIWM-Docker-GPU-Scheduler-with-Agent/aiwm-docker-control-plane/deploy/simulation/profiles:/profiles:ro
      - agent-t4-data:/state
  console:
    profiles: [console]
    build: ./AIWM-Docker-GPU-Console-Nextjs/aiwm-docker-gpu-console
    depends_on: [control-plane]
    environment:
      AIWM_API_BASE_URL: http://control-plane:8080
      AIWM_SESSION_COOKIE_SECURE: ${AIWM_SESSION_COOKIE_SECURE:-false}
    ports:
      - "${AIWM_CONSOLE_BIND_HOST:-127.0.0.1}:3000:3000"
volumes:
  metadata-data:
  control-plane-data:
  agent-a100-data:
  agent-t4-data:
